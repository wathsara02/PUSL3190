# Main local CPU training config.
seed: 42
device: cpu

model:
  recurrent_type: none
  recurrent_hidden_size: 128
  critic_hidden_size: 128

algo:
  lr: 0.0003
  lr_min: 0.00001
  lr_annealing: true
  clip_range: 0.2
  entropy_coef: 0.04
  entropy_coef_end: 0.003
  value_coef: 0.5
  gae_lambda: 0.95
  gamma: 0.99
  batch_size: 2048
  ppo_epochs: 3
  max_grad_norm: 0.5
  rule_mix_prob: 0.35

training:
  episodes: 2000000
  num_envs: 10
  exp_name: local_5600g_v2
  log_interval: 10000
  checkpoint_interval: 5000

reward_shaping:
  enabled: true
  illegal_action_penalty: -0.1
  overplay_penalty: -0.10
  trick_reward: 0.04
  cap_bonus: 0.4
  cap_penalty: -0.4
  declarer_bonus: 0.05
  trump_quality_bonus: 0.12
  declarer_team_win_bonus: 0.1
  declarer_team_loss_penalty: -0.1
  late_trick_reward: 0.03
  trump_cut_reward: 0.02
  wasted_trump_penalty: -0.06
  partner_save_reward: 0.08

logging:
  record_matches: false
  record_every: 1000
  max_recorded_matches: 500

eval:
  episodes: 1000
  baseline: rule
  deterministic: true
  during_training:
    enabled: true
    interval_episodes: 10000
    episodes: 1000
    baseline: rule
    deterministic: true
    device: cpu
    max_parallel: 1
    record_match_traces: false
    keep_eval_weights: true
    wait_on_finish: false

curriculum:
  enabled: true
  phase1_win_rate_threshold: 0.65
  phase1_window: 500
  frozen_update_interval: 2000

export:
  output_dir: artifacts
